<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Forge: West Africa Telemetry Sandbox</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; margin: 0; }
        .panel { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1.5rem; max-width: 800px; margin: 0 auto; }
        textarea { width: 100%; height: 280px; background: #0f172a; color: #38bdf8; border: 1px solid #334155; border-radius: 4px; padding: 1rem; font-family: monospace; box-sizing: border-box; resize: vertical; font-size: 0.9rem; line-height: 1.4; }
        button { background: #0284c7; color: #ffffff; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 1rem; font-size: 1rem; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #out { margin-top: 1.5rem; padding: 1rem; background: #0f172a; border-radius: 4px; border-left: 4px solid #38bdf8; }
        .score { font-size: 2.5rem; font-weight: bold; color: #4ade80; margin-bottom: 0.5rem; }
        .pill { display: inline-block; background: #1e293b; border: 1px solid #38bdf8; color: #38bdf8; padding: 0.35rem 0.85rem; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
        .mut { color: #94a3b8; font-size: 0.875rem; margin-top: 0.5rem; }
        .ok { color: #4ade80; font-size: 0.875rem; margin-top: 0.75rem; }
        .err { color: #ef4444; list-style-type: none; padding-left: 0; }
    </style>
</head>
<body>
    <div class="panel">
        <h2>The Forge: West Africa Telemetry Sandbox</h2>
        <p class="mut">Input your schema_wa_v1 compliance dispute payload below. Use test data only.</p>
        <textarea id="ta" spellcheck="false"></textarea>
        <div>
            <button id="run">Execute Security Matrix</button>
        </div>
        <div id="out"><span class="mut">Awaiting payload telemetry...</span></div>
    </div>
    <script src="app.js" defer></script>
</body>
</html>
